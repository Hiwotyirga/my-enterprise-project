dsn: postgres://root:secretpassword@postgres_db:5432/enterprise_db?sslmode=disable

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
  admin:
    base_url: http://localhost:4434/

selfservice:
  default_browser_return_url: http://localhost:4000/
  flows:
    error:
      ui_url: http://localhost:4000/error
    login:
      ui_url: http://localhost:4000/login
    registration:
      ui_url: http://localhost:4000/registration

log:
  level: debug
  leak_sensitive_values: true

secrets:
  cookie:
    - please-change-this-cookie-secret-string-to-something-random
  cipher:
    - short-cipher-secret-32-chars-max

courier:
  smtp:
    connection_uri: smtps://test:test@mailhog:1025/?skip_ssl_verify=true

identity:
  schemas:
    - id: default
      url: file:///etc/config/identity.schema.json